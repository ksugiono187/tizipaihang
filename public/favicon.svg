<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" />
  <rect width="256" height="256" rx="56" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <!-- Glowing Ladder / Ranking Bars -->
  <g transform="translate(68, 64)" filter="url(#glow)">
    <!-- Left bar -->
    <rect x="0" y="20" width="16" height="108" rx="8" fill="url(#accentGrad)" />
    <!-- Middle bar -->
    <rect x="52" y="10" width="16" height="118" rx="8" fill="url(#accentGrad)" />
    <!-- Right bar -->
    <rect x="104" y="0" width="16" height="128" rx="8" fill="url(#accentGrad)" />
    
    <!-- Swoosh / Upward Arrow representing speed and ranking -->
    <path d="M -10 90 Q 60 120 130 30 L 140 40 Q 60 140 -10 110 Z" fill="#38bdf8" />
  </g>
</svg>
