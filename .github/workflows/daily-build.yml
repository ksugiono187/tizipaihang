name: Daily SEO Auto-Build

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨2点 (UTC+8 -> UTC 18:00)
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Update Last Timestamp
        run: |
          echo "Last built on $(date)" > public/build-timestamp.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/build-timestamp.txt
          git commit -m "chore: auto update build timestamp [skip ci]" || echo "No changes to commit"
          git push
